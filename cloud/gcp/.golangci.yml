version: "2"
run:
  go: "1.21"
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - unconvert
    - unused
    - whitespace
  settings:
    staticcheck:
      checks:
        - SA*
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    paths:
      - tools/tools.go
      - deploytf/generated
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - tools/tools.go
      - deploytf/generated
      - third_party$
      - builtin$
      - examples$
