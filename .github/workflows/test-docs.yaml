name: Test Docs

on:
  pull_request:
    paths:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # External links and a11y are checked nightly (docs-nightly.yaml), keeping this within a few minutes
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_VERCEL_URL: nitric.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          install-command: yarn --frozen-lockfile
          working-directory: docs
      - name: Run format linting
        run: yarn format:check
      - name: Run spellcheck test
        run: yarn test:spellcheck
      - name: Build
        run: yarn cypress:build
        env:
          NEXT_PUBLIC_GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Internal link and SEO tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          headless: true
          config: video=false
          browser: chrome
          spec: cypress/e2e/broken-links.cy.ts,cypress/e2e/seo.cy.ts
          start: yarn start
          wait-on: "http://localhost:3000"
          working-directory: docs
        env:
          NEXT_PUBLIC_GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: docs/cypress/screenshots
