name: Test Docs

on:
  pull_request:
    paths:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks the built site without a browser; external links and a11y run nightly (docs-nightly.yaml)
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_VERCEL_URL: nitric.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - name: Install dependencies
        run: yarn --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Run format linting
        run: yarn format:check
      - name: Run spellcheck test
        run: yarn test:spellcheck
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: docs/.next/cache
          key: docs-next-${{ hashFiles('docs/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            docs-next-${{ hashFiles('docs/yarn.lock') }}-
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Check links and SEO tags
        run: yarn test:site
